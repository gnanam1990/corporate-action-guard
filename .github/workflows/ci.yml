name: CI

on:
  pull_request:
  push:
    branches: [main]

# A pushed branch and its PR would otherwise run the same work twice.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Deterministic CI: no live third-party endpoints in required checks.
  XSTOCKS_LIVE_CONTRACT_TEST: '0'
  XLAYER_LIVE_SMOKE_TEST: '0'

jobs:
  quality:
    name: Format, lint, architecture, types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install from the lockfile
        run: pnpm install --frozen-lockfile

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Gas snapshots are toolchain-specific. Keep CI on the repository's documented
          # local version instead of allowing "stable" to silently change the baseline.
          version: 1.7.1

      - name: Prettier
        run: pnpm exec prettier --check .

      - name: forge fmt
        run: forge fmt --check
        working-directory: contracts

      - name: ESLint
        run: pnpm lint

      - name: Architecture dependency rule
        run: pnpm arch:check

      - name: Runtime imports are production dependencies
        # `pg` was imported by production source and declared dev-only. Every test passed,
        # because tests install everything; a production install omitted it.
        run: pnpm check:deps

      - name: Monitoring configuration
        run: pnpm check:monitoring

      - name: Typecheck
        run: pnpm typecheck

      - name: Build readiness reflects docs/modules.json
        # The readiness table was hand-maintained until a formatter realigned its columns
        # and every string edit silently stopped matching. It is generated now, and this
        # fails if it is stale.
        run: pnpm docs:check

      - name: WCAG contrast of the design tokens
        # Asserted, not eyeballed: a palette change that drops a status below readable
        # fails the build rather than shipping.
        run: pnpm check:contrast

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Mutation test the safety predicate
        # Every guard in evaluatePreflight must be one the suite would notice losing.
        run: pnpm test:mutation

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: guard
          POSTGRES_PASSWORD: guard
          POSTGRES_DB: guard
          TZ: UTC
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U guard -d guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://guard:guard@localhost:5432/guard
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Migrations are idempotent
        # Re-running must be a clean no-op, or a redeploy is a schema hazard.
        run: pnpm db:migrate

      - run: pnpm test:integration

      - name: Backup archive and disposable restore drill
        env:
          BACKUP_PATH: ${{ runner.temp }}/cag-ci.dump
          DATABASE_ADMIN_URL: postgresql://guard:guard@localhost:5432/guard
          POSTGRES_TOOLS_IMAGE: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          POSTGRES_TOOLS_MOUNT: ${{ runner.temp }}
          POSTGRES_TOOLS_NETWORK: host
        run: |
          pnpm db:backup
          pnpm db:restore-drill

  contracts:
    name: Foundry
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build
        run: forge build --sizes
        working-directory: contracts

      - name: Tests, fuzz and invariants
        run: forge test -vv
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci

      - name: Golden vectors have not drifted from TypeScript
        # Regenerating must reproduce the committed file byte for byte. If it does not,
        # the two implementations disagree and every issued receipt would be rejected
        # on chain.
        run: |
          pnpm --filter @cag/receipts vectors
          git diff --exit-code packages/receipts/vectors/

      - name: Gas snapshot
        # Fuzz tests still run above. Their mean/median gas aggregation differs slightly
        # across runner platforms even with an identical seed, so the byte-stable snapshot
        # covers deterministic tests only.
        run: forge snapshot --check --no-match-test '^testFuzz_' || echo "::warning::gas snapshot drifted; run 'forge snapshot --no-match-test ^testFuzz_' and commit"
        working-directory: contracts

  containers:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: API and worker image
        # Built, not assumed. The first version of this Dockerfile failed on `pnpm prune`
        # in a non-TTY container, which only a real build reveals.
        run: docker build -f infra/Dockerfile -t cag-api:ci .

      - name: Console image
        run: docker build -f infra/Dockerfile.web -t cag-web:ci .

      - name: Images run as a non-root user
        run: |
          for image in cag-api:ci cag-web:ci; do
            user=$(docker run --rm --entrypoint sh "$image" -c 'id -un')
            echo "$image runs as $user"
            [ "$user" = "guard" ] || { echo "::error::$image runs as $user, expected guard"; exit 1; }
          done

      - name: No secret material baked into an image
        run: |
          for image in cag-api:ci cag-web:ci; do
            if docker run --rm --entrypoint sh "$image" -c 'env' | grep -Ei 'PRIVATE_KEY=.|DATABASE_URL=.|API_KEY=.'; then
              echo "::error::$image has a credential baked into its environment"
              exit 1
            fi
          done
          echo "no baked credentials in either image"

  web:
    name: Web build and bundle secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Production web build
        run: pnpm --filter @cag/web build

      - name: No secret may reach the browser bundle
        run: pnpm scan:bundle

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Dependency audit
        # Fails on a real finding; warns and continues when the npm advisory service is
        # unreachable. A third party being down must never take main red — the same rule
        # that keeps the live probes out of required checks.
        run: pnpm audit:deps

      - name: No committed secret material
        run: node scripts/scan-secrets.mjs

      - name: The web container cannot see a server secret
        # Asserted against the compose file, because "we were careful" is not a control.
        run: node scripts/check-compose-secrets.mjs
